<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NetAtlas - Connexion utilisateur</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <script
        src="{{ url_for('static', filename='passkey_authentification.js') }}"
        defer
    ></script>
</head>

<body>
    <a class="logo logo-home" href="{{ url_for('accueil') }}">
        NETATLAS
    </a>

    <main class="page-acces">
        <section class="acces-contenu">

            <h1>Connexion utilisateur</h1>

            <p>
                Connectez-vous avec votre clé d'accès Passkey.
            </p>

            <input
                type="hidden"
                id="passkey-csrf-token"
                value="{{ csrf_token() }}"
            >

            <button
                type="button"
                id="authentifier-passkey"
                data-role="utilisateur"
                class="choix-acces"
            >
                Se connecter avec une Passkey
            </button>

            <p
                id="passkey-message"
                role="status"
                aria-live="polite"
            ></p>

            <a
                class="choix-acces"
                href="{{ url_for('acces') }}"
            >
                Retour
            </a>

        </section>
    </main>
</body>
</html>
