<!DOCTYPE html>
<html lang="fr">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<title>NetAtlas - Espace utilisateur</title>

		<link
				rel="stylesheet"
				href="{{ url_for('static', filename='style.css') }}"
				>
	</head>

		<body>
			<a class="logo logo-home" href="{{ url_for('accueil') }}">
				NETATLAS
			</a>

			<main class="page-acces">
				<section class="acces-contenu">
					<h1>Bienvenue {{ nom }}</h1>

					<a class="choix-acces" href="{{ url_for('recherche_globale_web', origine='utilisateur') }}">
						Consulter NetAtlas
					</a>

					<form action="{{ url_for('deconnexion') }}" method="POST">
						<input
								type="hidden"
								name="csrf_token"
								value="{{ csrf_token() }}"
								>
								<button type="submit" class="choix-acces">
									Déconnexion
								</button>
					</form>

				</section>
			</main>
		</body>
</html>
