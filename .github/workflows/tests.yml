name: NetAtlas Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ruff:
    name: Qualite du code - Ruff
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Installer Ruff
        run: pip install ruff

      - name: Vérifier la qualité du code
        run: ./scripts/check_netatlas.sh ruff

  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: netatlas_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NETATLAS_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: netatlas_test
      DB_USER: netatlas_ci_user
      DB_PASSWORD: netatlas_ci_password

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install pytest "psycopg[binary]" python-dotenv pytest-cov ruff argon2-cffi

      - name: Préparer PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d netatlas_test -f database/test_schema.sql
          psql -h localhost -U postgres -d netatlas_test -f database/test_seed.sql

          psql -h localhost -U postgres -d netatlas_test <<'SQL'
          CREATE USER netatlas_ci_user WITH PASSWORD 'netatlas_ci_password';

          GRANT CONNECT ON DATABASE netatlas_test TO netatlas_ci_user;
          GRANT USAGE ON SCHEMA public TO netatlas_ci_user;

          GRANT SELECT, INSERT, UPDATE ON ALL TABLES IN SCHEMA public
          TO netatlas_ci_user;

          GRANT DELETE ON TABLE pubic.avis
          TO netatlas_ci_user;

          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public
          TO netatlas_ci_user;
          SQL

      - name: Diagnostic permissions PostgreSQL CI
        run: |
         PGPASSWORD="$DB_PASSWORD" psql \
          -h "$DB_HOST" \
          -U "$DB_USER" \
          -d "$DB_NAME" \
          -c "SELECT current_user, current_database();"

         PGPASSWORD="$DB_PASSWORD" psql \
          -h "$DB_HOST" \
          -U "$DB_USER" \
          -d "$DB_NAME" \
          -c "SELECT has_table_privilege(current_user, 'public.avis', 'DELETE') AS delete_avis, has_table_privilege(current_user, 'public.villes', 'DELETE') AS delete_villes;"


      - name: Tests et Couverture
        run: ./scripts/check_netatlas.sh tests



